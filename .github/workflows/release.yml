name: Release

# Builds the exe, zips it with its licence files, and publishes a GitHub release with a SHA-256 checksum, when either:
# - a push to main brings a Cargo.toml version that has no tag yet (bump the version and date its CHANGELOG entry in
#   the PR: merging it releases, and the release creates the tag), or
# - a tag like v0.2.1 is pushed by hand (it must match the version in Cargo.toml).
on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

# (a merge and a tag pushed right after it must not publish the same version twice at once)
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Which version this push releases, if any.
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4

      - id: v
        shell: bash
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "(.+)"/\1/')
          tag="v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            if [ "$tag" != "${{ github.ref_name }}" ]; then
              echo "::error::Tag ${{ github.ref_name }} does not match Cargo.toml version $version"
              exit 1
            fi
            echo "release=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$(git ls-remote --tags origin "refs/tags/$tag")" ]; then
            echo "$tag is already released: nothing to do"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "$tag has no tag yet: releasing it"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: windows-latest
    env:
      TAG: ${{ needs.version.outputs.tag }}
      RUSTFLAGS: >-
        --remap-path-prefix=${{ github.workspace }}=.
        --remap-path-prefix=C:\Users\runneradmin\.cargo=~/.cargo
        --remap-path-prefix=C:\Users\runneradmin\.rustup=~/.rustup
    steps:
      - uses: actions/checkout@v4

      # The release notes are this version's entry in CHANGELOG.md (the same text the app shows under What's new).
      - name: Release notes from CHANGELOG.md
        shell: pwsh
        run: |
          $version = $env:TAG.TrimStart('v')
          $lines = @(Get-Content CHANGELOG.md -Encoding utf8)
          $head = $lines | Select-String -Pattern "^## $([regex]::Escape($version)) - \d{4}-\d{2}-\d{2}\s*$" | Select-Object -First 1
          if (-not $head) { Write-Error "CHANGELOG.md has no '## $version - YYYY-MM-DD' entry (rename Unreleased to it)"; exit 1 }
          $body = @()
          foreach ($line in $lines[$head.LineNumber..($lines.Count - 1)]) {
            if ($line -match '^## ') { break }
            $body += $line
          }
          $notes = ($body -join "`n").Trim()
          if (-not $notes) { Write-Error "CHANGELOG.md's entry for $version is empty"; exit 1 }
          $notes | Out-File -Encoding utf8 release-notes.md

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --release

      - name: Build
        run: cargo build --release

      - name: Package
        shell: pwsh
        run: |
          $tag = $env:TAG
          $name ="maple-exp-overlay-$tag-windows-x64"
          New-Item -ItemType Directory -Path $name | Out-Null
          Copy-Item target/release/maple-exp-overlay.exe, README.md, CHANGELOG.md, LICENSE, NOTICE -Destination $name
          Compress-Archive -Path "$name/*" -DestinationPath "$name.zip"
          $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Out-File -Encoding ascii "$name.zip.sha256"
          "ASSET=$name.zip" | Out-File -Append -Encoding ascii $env:GITHUB_ENV

      # The in-app updater downloads the bare exe and accepts it only with a valid signature from the key whose public
      # half is built into the app (src/update.rs). The secret key (a minisign key made with -W, no password) is the
      # repository secret MINISIGN_SECRET_KEY. The trusted comment names the release, so an old exe can't pose as new.
      - name: Sign the exe for the in-app updater
        shell: pwsh
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          if (-not $env:MINISIGN_SECRET_KEY) { Write-Error "The MINISIGN_SECRET_KEY secret is missing"; exit 1 }
          # minisign 0.12, pinned by its SHA-256
          Invoke-WebRequest https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-win64.zip -OutFile minisign.zip
          $hash = (Get-FileHash minisign.zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne "37b600344e20c19314b2e82813db2bfdcc408b77b876f7727889dbd46d539479") { Write-Error "minisign download changed: $hash"; exit 1 }
          Expand-Archive minisign.zip minisign-bin
          # (the zip holds an x86_64 and an aarch64 build: take the x86_64 one)
          $minisign = (Get-ChildItem -Recurse minisign-bin -Filter minisign.exe | Where-Object FullName -match 'x86_64' | Select-Object -First 1).FullName
          if (-not $minisign) { Write-Error "no x86_64 minisign.exe in the download"; exit 1 }
          $key = Join-Path $env:RUNNER_TEMP "minisign.key"
          Set-Content -Path $key -Value $env:MINISIGN_SECRET_KEY -Encoding ascii
          Copy-Item target/release/maple-exp-overlay.exe maple-exp-overlay.exe
          try {
            & $minisign -S -s $key -m maple-exp-overlay.exe -t "maple-exp-overlay $env:TAG"
            $code = $LASTEXITCODE
          } finally {
            Remove-Item $key -ErrorAction SilentlyContinue
          }
          if ($code -ne 0) { exit $code }
          if (-not (Test-Path maple-exp-overlay.exe.minisig)) { Write-Error "no signature was written"; exit 1 }

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          # (after a merge the tag doesn't exist yet: the release creates it on the merged commit)
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          files: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256
            maple-exp-overlay.exe
            maple-exp-overlay.exe.minisig
          body_path: release-notes.md
