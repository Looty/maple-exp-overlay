name: Release

# Push a tag like v0.2.1 (it must match the version in Cargo.toml) and this builds the exe, zips it with its licence files,
# and publishes a GitHub release with a SHA-256 checksum.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      RUSTFLAGS: >-
        --remap-path-prefix=${{ github.workspace }}=.
        --remap-path-prefix=C:\Users\runneradmin\.cargo=~/.cargo
        --remap-path-prefix=C:\Users\runneradmin\.rustup=~/.rustup
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches Cargo.toml
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches.Groups[1].Value
          if ("v$version" -ne "${{ github.ref_name }}") {
            Write-Error "Tag ${{ github.ref_name }} does not match Cargo.toml version $version"
            exit 1
          }

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --release

      - name: Build
        run: cargo build --release

      - name: Package
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $name = "maple-exp-overlay-$tag-windows-x64"
          New-Item -ItemType Directory -Path $name | Out-Null
          Copy-Item target/release/maple-exp-overlay.exe, README.md, LICENSE, NOTICE -Destination $name
          Compress-Archive -Path "$name/*" -DestinationPath "$name.zip"
          $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Out-File -Encoding ascii "$name.zip.sha256"
          "ASSET=$name.zip" | Out-File -Append -Encoding ascii $env:GITHUB_ENV

      # The in-app updater downloads the bare exe and accepts it only with a valid signature from the key whose public
      # half is built into the app (src/update.rs). The secret key (a minisign key made with -W, no password) is the
      # repository secret MINISIGN_SECRET_KEY. The trusted comment names the release, so an old exe can't pose as new.
      - name: Sign the exe for the in-app updater
        shell: pwsh
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          if (-not $env:MINISIGN_SECRET_KEY) { Write-Error "The MINISIGN_SECRET_KEY secret is missing"; exit 1 }
          # minisign 0.12, pinned by its SHA-256
          Invoke-WebRequest https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-win64.zip -OutFile minisign.zip
          $hash = (Get-FileHash minisign.zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne "37b600344e20c19314b2e82813db2bfdcc408b77b876f7727889dbd46d539479") { Write-Error "minisign download changed: $hash"; exit 1 }
          Expand-Archive minisign.zip minisign-bin
          # (the zip holds an x86_64 and an aarch64 build: take the x86_64 one)
          $minisign = (Get-ChildItem -Recurse minisign-bin -Filter minisign.exe | Where-Object FullName -match 'x86_64' | Select-Object -First 1).FullName
          if (-not $minisign) { Write-Error "no x86_64 minisign.exe in the download"; exit 1 }
          $key = Join-Path $env:RUNNER_TEMP "minisign.key"
          Set-Content -Path $key -Value $env:MINISIGN_SECRET_KEY -Encoding ascii
          Copy-Item target/release/maple-exp-overlay.exe maple-exp-overlay.exe
          try {
            & $minisign -S -s $key -m maple-exp-overlay.exe -t "maple-exp-overlay ${{ github.ref_name }}"
            $code = $LASTEXITCODE
          } finally {
            Remove-Item $key -ErrorAction SilentlyContinue
          }
          if ($code -ne 0) { exit $code }
          if (-not (Test-Path maple-exp-overlay.exe.minisig)) { Write-Error "no signature was written"; exit 1 }

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256
            maple-exp-overlay.exe
            maple-exp-overlay.exe.minisig
          generate_release_notes: true
